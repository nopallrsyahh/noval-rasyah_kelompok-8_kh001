name: libraryku
description: Aplikasi Perpustakaan Digital LibraryKu
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  path: ^1.8.3
  google_fonts: ^6.2.1
  firebase_core: ^5.1.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.1.0
  google_sign_in: ^6.2.1
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/perpustakaan.jpg